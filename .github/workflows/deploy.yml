name: Deploy to Production VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "DEBUG: whoami = $(whoami)"
            echo "DEBUG: hostname = $(hostname)"
            echo "DEBUG: home dir = $HOME"
            echo "DEBUG: pwd = $(pwd)"
            ls -la /home/ 2>&1 || echo "cannot list /home"
            ls -la /home/vibhavkulshrestha/ 2>&1 || echo "cannot list vibhavkulshrestha home"
            cd /home/vibhavkulshrestha/vkai-insurance-client-api
            git pull origin main
            docker compose down
            docker compose up --build -d
            sleep 5
            curl -f https://146.148.64.235.nip.io/healthz
